<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Register</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <!-- Stil -->
  <link rel="stylesheet" href="/auth.css" />
</head>
<body class="auth-body">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg fixed-top" aria-label="Navigație principală">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand" href="/index.html">
        <img src="/logo1.jpg" alt="Education with Style logo" width="36" height="36">
        <span>Prof &amp; Coach <b>ANCA</b></span>
      </a>
      <button class="h-nav-toggler navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Deschide meniu">
        <span class="h-burger"><span></span><span></span><span></span></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="/galerie.html">Galerie</a></li>
          <li class="nav-item"><a class="nav-link" href="/index.html#contact">Contact</a></li>

          <!-- Auth — gestionat de /navbar-auth.js -->
          <li class="nav-item d-none"><a class="nav-link" href="/admin.html" id="nav-admin">Admin</a></li>
          <li class="nav-item d-none"><a class="nav-link" href="/dashboard.html" id="nav-dash">Contul meu</a></li>
          <li class="nav-item d-none"><span class="nav-link" id="navEmail" style="opacity:.65;font-size:13px;pointer-events:none;"></span></li>
          <li class="nav-item d-none"><button class="btn btn-sm btn-outline-light ms-lg-1" id="btnLogout">Logout</button></li>
          <li class="nav-item"><a class="nav-link active" href="/auth.html" id="nav-auth">Login</a></li>

          <li class="nav-item h-nav-cta-wrap">
            <a class="h-nav-cta" href="https://wa.me/40767283598" target="_blank" rel="noopener">
              <i class="fab fa-whatsapp"></i>
              <span>Rezervă</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONȚINUT: doar cardul (fără imagine) -->
  <main class="auth-wrapper with-navbar auth-narrow">
    <section class="auth-card">
      <header class="auth-head">
        <img class="auth-head-logo" src="/logo1.jpg" alt="Education with Style">
        <h1 class="auth-title">Intră în cont</h1>
        <p class="auth-sub">Autentifică-te sau creează un cont nou — simplu și rapid.</p>
      </header>

      <div id="msg" class="auth-msg d-none"></div>

      <div class="form-grid">
        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <div class="pwd-wrap">
          <input type="password" id="password" placeholder="Parolă" autocomplete="current-password" />
          <button class="toggle-pwd" type="button" aria-label="Arată/ascunde parola">👁</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="registerUser()">Înregistrare</button>
        <button onclick="loginUser()" class="btn-outline">Logare</button>
      </div>

      <div class="divider"><span>sau</span></div>

      <div class="extras">
        <button id="btnTempPwd" class="btn-ghost" type="button">↻ Primește o parolă temporară pe email</button>
        <a href="/shop.html" class="btn-ghost">→ Mergi la magazin</a>
      </div>
    </section>
  </main>

  <script>
    const _nav = document.querySelector('.navbar');
    window.addEventListener('scroll', () => _nav?.classList.toggle('scrolled', window.scrollY > 50), { passive: true });
  </script>

  <!-- Conectează auth.js existent -->
  <script type="module">
    import { registerUser, loginUser } from './auth.js';
    window.registerUser = registerUser;
    window.loginUser = loginUser;
  </script>

  <!-- Script pentru parolă temporară + toggle parolă -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabase = createClient(
      'https://gxavdytkcukxnvonasur.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YXZkeXRrY3VreG52b25hc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzUzOTgsImV4cCI6MjA2OTQ1MTM5OH0.n2vXj6iziz3896EpzhjOotTuveqd7GjIhgAuExCOLW8'
    )

    /* API backend (Render) — schimbi aici dacă ai alt host */
    const API_BASE =
      (typeof import.meta !== 'undefined' && import.meta.env?.VITE_API_BASE)
      || 'https://stripe-backend-q89t.onrender.com';

    // toggle parolă
    const btnToggle = document.querySelector('.toggle-pwd')
    const pwd = document.getElementById('password')
    btnToggle?.addEventListener('click', () => {
      const show = pwd.type === 'password'
      pwd.type = show ? 'text' : 'password'
      btnToggle.textContent = show ? '🙈' : '👁'
    })

    // ——— Parolă temporară via backend ———
    document.getElementById('btnTempPwd').addEventListener('click', async ()=>{
      const email = (document.getElementById('email').value || '').trim()
      if (!email) {
        await window.showPopup?.({ title:'Eroare', message:'Te rog introdu emailul.' })
        return
      }

      try{
        const r = await fetch(`${API_BASE}/api/auth/send-temp-password`, {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ email })
        })
        const out = await r.json().catch(()=> ({}))
        if (!r.ok) throw new Error(out.message || 'Nu am putut trimite parola temporară.')

        await window.showPopup?.({
          title:'Email trimis',
          message:'Ți-am trimis o parolă temporară. Autentifică-te cu emailul + parola primită, apoi o poți schimba din Dashboard.'
        })
      }catch(e){
        await window.showPopup?.({ title:'Eroare', message: e.message || 'A apărut o problemă. Reîncearcă.' })
      }
    })
  </script>
  <script type="module" src="/navbar-auth.js"></script>
</body>
</html>
