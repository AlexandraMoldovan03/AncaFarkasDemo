<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Register</title>

  <!-- Bootstrap (ca pe shop/dashboard) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Stil -->
  <link rel="stylesheet" href="/auth.css" />
</head>
<body class="auth-body">
  <!-- NAVBAR (identic cu restul site-ului) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/index.html">
        <img src="/logo1.jpg" alt="Logo" style="height:40px;width:auto;margin-right:10px;">
        <span>Prof&Coach FARKAS-RUSU <b>ANCA</b></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONȚINUT: doar cardul (fără imagine) -->
  <main class="auth-wrapper with-navbar auth-narrow">
    <section class="auth-card">
      <header class="auth-head">
        <h1 class="auth-title">Login / Register</h1>
        <p class="auth-sub">Intră în cont sau creează unul nou — simplu și rapid.</p>
      </header>

      <div id="msg" class="auth-msg d-none"></div>

      <div class="form-grid">
        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <div class="pwd-wrap">
          <input type="password" id="password" placeholder="Parolă" autocomplete="current-password" />
          <button class="toggle-pwd" type="button" aria-label="Arată/ascunde parola">👁</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="registerUser()">Înregistrare</button>
        <button onclick="loginUser()" class="btn-outline">Logare</button>
      </div>

      <div class="divider"><span>sau</span></div>

      <div class="extras">
        <button id="btnTempPwd" class="btn-ghost" type="button">↻ Primește o parolă temporară pe email</button>
        <a href="/shop.html" class="btn-ghost">→ Mergi la magazin</a>
      </div>
    </section>
  </main>

  <!-- Conectează auth.js existent -->
  <script type="module">
    import { registerUser, loginUser } from './auth.js';
    window.registerUser = registerUser;
    window.loginUser = loginUser;
  </script>

  <!-- Script pentru parolă temporară + toggle parolă -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabase = createClient(
      'https://gxavdytkcukxnvonasur.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YXZkeXRrY3VreG52b25hc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzUzOTgsImV4cCI6MjA2OTQ1MTM5OH0.n2vXj6iziz3896EpzhjOotTuveqd7GjIhgAuExCOLW8'
    )

    /* API backend (Render) — schimbi aici dacă ai alt host */
    const API_BASE =
      (typeof import.meta !== 'undefined' && import.meta.env?.VITE_API_BASE)
      || 'https://stripe-backend-q89t.onrender.com';

    // toggle parolă
    const btnToggle = document.querySelector('.toggle-pwd')
    const pwd = document.getElementById('password')
    btnToggle?.addEventListener('click', () => {
      const show = pwd.type === 'password'
      pwd.type = show ? 'text' : 'password'
      btnToggle.textContent = show ? '🙈' : '👁'
    })

    // ——— Parolă temporară via backend ———
    document.getElementById('btnTempPwd').addEventListener('click', async ()=>{
      const email = (document.getElementById('email').value || '').trim()
      if (!email) {
        await window.showPopup?.({ title:'Eroare', message:'Te rog introdu emailul.' })
        return
      }

      try{
        const r = await fetch(`${API_BASE}/api/auth/send-temp-password`, {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ email })
        })
        const out = await r.json().catch(()=> ({}))
        if (!r.ok) throw new Error(out.message || 'Nu am putut trimite parola temporară.')

        await window.showPopup?.({
          title:'Email trimis',
          message:'Ți-am trimis o parolă temporară. Autentifică-te cu emailul + parola primită, apoi o poți schimba din Dashboard.'
        })
      }catch(e){
        await window.showPopup?.({ title:'Eroare', message: e.message || 'A apărut o problemă. Reîncearcă.' })
      }
    })
  </script>
</body>
</html>
