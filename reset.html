<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trimite parolă temporară</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-wrapper with-navbar">
    <section class="auth-card">
      <h1 class="auth-title">Primește o parolă temporară</h1>
      <div id="msg" class="auth-msg d-none"></div>

      <div class="form-grid" style="grid-template-columns: 1fr">
        <input type="email" id="email" placeholder="Emailul tău" autocomplete="email" />
      </div>

      <div class="actions" style="grid-template-columns:1fr">
        <button id="btnSend">Trimite pe email</button>
      </div>

      <p class="mt-2" style="font-size:.95rem;opacity:.8">
        Vei primi pe email o parolă temporară (cod). Loghează-te cu ea și schimb-o din Dashboard.
      </p>
    </section>
  </main>

  <script type="module">
    const btn = document.getElementById('btnSend');
    const msg = document.getElementById('msg');
    const emailEl = document.getElementById('email');

    function showMsg(text, type='success'){
      msg.textContent = text;
      msg.className = `auth-msg ${type==='success'?'success':'error'}`;
      msg.classList.remove('d-none');
    }

    btn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      if(!email){ showMsg('Introdu un email valid.', 'error'); return; }

      btn.disabled = true;
      try{
        const res = await fetch('/api/auth/send-temp-password', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ email })
        });
        const out = await res.json();
        if(!res.ok) throw new Error(out.message || 'Eroare la trimitere.');

        showMsg('Parola temporară a fost trimisă pe email. Verifică inbox-ul (și Spam).', 'success');
      }catch(e){
        showMsg(e.message || 'Nu am putut trimite parola temporară.', 'error');
      }finally{
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
