<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schimbă parola</title>

  <!-- Stiluri existente (aceleași ca pe login) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-wrapper with-navbar">
    <section class="auth-card">
      <h1 class="auth-title">Schimbă parola</h1>
      <div id="msg" class="auth-msg d-none"></div>

      <div class="form-grid">
        <input type="password" id="newPwd" placeholder="Parolă nouă" />
        <input type="password" id="newPwd2" placeholder="Confirmă parola" />
      </div>

      <div class="actions" style="grid-template-columns:1fr">
        <button id="btnChange">Actualizează parola</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    // ——— Supabase ———
    const supabase = createClient(
      'https://gxavdytkcukxnvonasur.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YXZkeXRrY3VreG52b25hc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzUzOTgsImV4cCI6MjA2OTQ1MTM5OH0.n2vXj6iziz3896EpzhjOotTuveqd7GjIhgAuExCOLW8'
    )

    // ——— UI helpers ———
    const btn = document.getElementById('btnChange')
    const msg = document.getElementById('msg')
    function showMsg(text, type='success'){
      msg.textContent = text
      msg.className = `auth-msg ${type==='success'?'success':'error'}`
      msg.classList.remove('d-none')
    }

    // ——— 1) Preia parametrii (acceptă și #, și ?) ———
    const rawParams = location.hash.slice(1) || location.search.slice(1)
    const params = new URLSearchParams(rawParams)

    // Afișează eventualele erori venite în URL
    if (params.get('error')) {
      const code = params.get('error_code')
      showMsg(
        code === 'otp_expired'
          ? 'Linkul din email a expirat. Revino la Login și cere o nouă resetare.'
          : 'Link invalid. Te rugăm să soliciți din nou resetarea parolei.',
        'error'
      )
    }

    // ——— 2) Dacă avem tokenurile în URL, setăm manual sesiunea ———
    const access_token  = params.get('access_token')
    const refresh_token = params.get('refresh_token')
    if (access_token && refresh_token) {
      try { await supabase.auth.setSession({ access_token, refresh_token }) } catch {}
    }

    // ——— 3) Așteaptă sesiunea „recovery” ———
    btn.disabled = true
    let hasSession = false

    let { data:{ session } } = await supabase.auth.getSession()
    if (session) {
      hasSession = true
      btn.disabled = false
    } else {
      supabase.auth.onAuthStateChange((evt, newSession) => {
        if (!hasSession && (evt === 'PASSWORD_RECOVERY' || newSession)) {
          hasSession = true
          btn.disabled = false
          showMsg('Link valid. Introdu parola nouă.', 'success')
        }
      })
      // mesaj informativ până vine sesiunea (dacă vine din query, setSession o va porni)
      showMsg('Verificăm linkul… dacă nu pornește, revino la pagina de login și cere din nou resetarea.', 'error')
    }

    // ——— 4) Actualizare parolă ———
    btn.addEventListener('click', async ()=>{
      if (!hasSession){
        showMsg('Link invalid sau expirat. Solicită din nou resetarea parolei.', 'error')
        return
      }
      const p1 = document.getElementById('newPwd').value.trim()
      const p2 = document.getElementById('newPwd2').value.trim()
      if (!p1 || p1.length < 6){ showMsg('Parola trebuie să aibă minim 6 caractere.', 'error'); return }
      if (p1 !== p2){ showMsg('Parolele nu coincid.', 'error'); return }

      try{
        const { error } = await supabase.auth.updateUser({ password: p1 })
        if (error) throw error
        showMsg('Parola a fost actualizată. Te ducem în dashboard…', 'success')
        setTimeout(()=> location.href = '/dashboard.html', 1200)
      }catch(e){
        showMsg(e.message || 'Nu am putut actualiza parola.', 'error')
      }
    })
  </script>
</body>
</html>
