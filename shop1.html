








<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Magazin — Cursuri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CSS-ul paginii de shop (grid + carduri) -->
  <link rel="stylesheet" href="/shop.css" />
  <style>
    /* spațiu sub navbar-ul fixed */
    .with-navbar { padding-top: 84px; }
  </style>
</head>
<body>
  <!-- HEADER (Bootstrap, ca pe pagina principală) -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="/index.html">
          <img src="/logo1.jpg" alt="Logo" style="height:40px;width:auto;margin-right:10px;">
          <span>Prof&Coach FARKAS-RUSU <b>ANCA</b></span>
        </a>

        <!-- Buton Hamburger -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Meniu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Meniu -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="/index.html">Home</a>
            </li>

            <!-- Afișare dinamică: Login / Dashboard + Logout -->
            <li class="nav-item" id="nav-login">
              <a class="nav-link" href="/auth.html">Login / Register</a>
            </li>
            <li class="nav-item d-none" id="nav-dashboard">
              <a class="nav-link" href="/dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item d-none" id="nav-logout">
              <button class="btn btn-sm btn-outline-light ms-lg-2" id="btnLogout">Logout</button>
            </li>

            <!-- Email user (opțional) -->
            <li class="nav-item d-none" id="nav-user">
              <span class="nav-link disabled" id="navEmail" style="opacity:.8;"></span>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONȚINUT -->
  <main class="shop-container with-navbar">
    <!-- HERO -->
    <section class="shop-hero">
      <h1>Cursuri disponibile</h1>
      <p>Cumpără cu emailul contului dacă ești logat(ă) sau ca invitat — primești PDF-ul pe emailul introdus.</p>
    </section>

    <!-- BARĂ AUTENTIFICARE / INVITAT -->
    <section class="shop-authbar">
      <div id="authStatus">Verificare autentificare…</div>

      <div id="guestBox" class="guest-box" hidden>
        <label for="guestEmail" class="d-flex align-items-center gap-2 m-0">
          <span>Email pentru livrarea PDF (invitat):</span>
          <input id="guestEmail" type="email" placeholder="nume@exemplu.com" />
        </label>
      </div>
    </section>

    <!-- LISTĂ PRODUSE (card-urile vin din shop.js) -->
    <section id="products" class="grid"></section>
  </main>

  <!-- FOOTER -->
  <footer class="shop-footer">
    <small>&copy; <span id="year"></span> — Toate drepturile rezervate.</small>
  </footer>

  <!-- NAV: toggle în funcție de autentificare -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    const supabase = createClient(
      'https://gxavdytkcukxnvonasur.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YXZkeXRrY3VreG52b25hc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzUzOTgsImV4cCI6MjA2OTQ1MTM5OH0.n2vXj6iziz3896EpzhjOotTuveqd7GjIhgAuExCOLW8'
    )

    const elLogin = document.getElementById('nav-login')
    const elDash  = document.getElementById('nav-dashboard')
    const elLogout= document.getElementById('nav-logout')
    const elUser  = document.getElementById('nav-user')
    const elEmail = document.getElementById('navEmail')

    const setNav = (email) => {
      const logged = !!email
      elLogin.classList.toggle('d-none', logged)
      elDash.classList.toggle('d-none', !logged)
      elLogout.classList.toggle('d-none', !logged)
      elUser.classList.toggle('d-none', !logged)
      if (logged) elEmail.textContent = email
    }

    // inițial
    const { data: { user } } = await supabase.auth.getUser()
    setNav(user?.email || null)

    // reacționează la schimbări de sesiune
    supabase.auth.onAuthStateChange((_evt, sess) => {
      setNav(sess?.user?.email || null)
    })

    // logout
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.href = '/auth.html'
    })

    // footer year
    document.getElementById('year').textContent = new Date().getFullYear()
  </script>

  <!-- LOGICĂ SHOP (listează produse + checkout) -->
  <script type="module" src="/shop.js"></script>
</body>
</html>
