<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Galerie foto — Education with Style</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --gap: 1.2rem;
      --radius: 16px;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      --shadow-lg: 0 30px 80px rgba(0,0,0,.55);
    }
    body{ font-family:'Poppins',sans-serif; background:#0b0f0c; color:#e9f0f6; }
    .with-navbar{ padding-top:84px; }

    /* HERO */
    .g-hero{ border-radius:22px; overflow:hidden; position:relative; }
    .g-hero img{ width:100%; height:260px; object-fit:cover; filter:brightness(.75); }
    .g-hero .txt{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
    .g-hero h1{ margin:0; font-weight:700; }

    /* ===== Masonry Pinterest-like ===== */
    .masonry{
      column-gap: 10px;
      column-width: 170px;    /* mobil: 2-3 coloane */
      padding: 8px;
    }
    @media (min-width:480px){ .masonry{ column-width:200px } }
    @media (min-width:768px){ .masonry{ column-width:240px; column-gap:12px } }
    @media (min-width:1200px){ .masonry{ column-width:280px; column-gap:14px } }

    .g-item{
      display:block;
      break-inside: avoid;
      margin:0 0 10px;
      border-radius:14px;
      overflow:hidden;
      background:#0b0f0c;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
      transition: box-shadow .18s ease;
      cursor:pointer;
    }
    .g-item:hover{ box-shadow:0 16px 36px rgba(0,0,0,.35) }
    .g-item img{
      width:100%;
      height:auto;
      display:block;
      object-fit:cover;  /* păstrează compoziția din thumb */
    }
    @media (max-width:380px){
      .masonry{ column-width:150px; column-gap:8px }
      .g-item{ border-radius:12px; margin-bottom:8px }
    }

    /* ===== Lightbox (Modal) ===== */
    .modal-backdrop{ z-index:1990 }
    #lbModal.modal{ z-index:2000 }

    #lbModal .modal-content{
      position:relative;
      background:transparent;
      border:0;
      box-shadow:none;
    }
    #lbModal .btn-close{
      position:absolute; top:8px; right:8px;
      z-index:2002;
      filter: invert(1);            /* alb pe fundal închis */
      pointer-events:auto;
    }

    .lb-wrap{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.75rem;
      padding:.25rem .5rem;
    }

    .lb-frame{
      display:flex;
      align-items:center;
      justify-content:center;
      max-width:min(96vw, 1200px);
      max-height:calc(100dvh - 120px);  /* loc pentru X / nav / caption */
      margin:0 auto;
      padding:0;
      background:transparent;
      border-radius:14px;
      overflow:hidden;
      box-shadow: var(--shadow-lg);
      z-index:1;
    }
    #lbImg{
      display:block;
      width:auto;
      height:auto;
      max-width:100%;
      max-height:100%;
      object-fit:contain;   /* cheia: imagine completă, fără crop */
      background:transparent;
      border-radius: 14px; 
    }
    /* Aplica doar în browsere WebKit/Chromium (iOS/Chrome) */
@supports (-webkit-appearance: none) {
  #lbImg{
    max-width: calc(100% + 2px);
    margin-left: -1px;
    margin-right: -1px;
  }
}

#lbModal .modal-content{ overflow: visible; }


    #lbCap{
      color:#e9ecef;
      font-size:.95rem;
      padding:8px 12px;
      text-align:center;
      background:rgba(0,0,0,.35);
    }

    .lb-nav{
      border:0;
      width:42px; height:42px;
      border-radius:50%;
      background:rgba(255,255,255,.85);
      color:#111; font-size:28px;
      display:grid; place-items:center;
      cursor:pointer; user-select:none;
      transition: filter .15s ease, transform .15s ease;
      z-index:2;
    }
    .lb-nav:hover{ filter:brightness(.95); transform:scale(1.05) }
    @media (max-width:576px){
      /* dacă vrei să le ascunzi pe mobil, decomentează: */
      /* #lbModal .lb-nav{ display:none } */
    }

    @media (prefers-reduced-motion: reduce){
      .g-item, .lb-nav{ transition:none !important }
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/index.html">
        <img src="/logo1.jpg" alt="Logo" style="height:40px;width:auto;margin-right:10px;">
        <span>Prof&Coach FARKAS-RUSU <b>ANCA</b></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link active" href="/galerie.html">Galerie</a></li>
          <li class="nav-item"><a class="nav-link" href="/auth.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container with-navbar">
    <!-- HERO -->
    <div class="g-hero mb-3">
      <img src="/banner.jpg" alt="" aria-hidden="true">
      <div class="txt">
        <h1>Galerie foto</h1>
        <p class="text-white-50">Spațiul „Education with Style”, activități și momente dragi</p>
      </div>
    </div>

    <!-- GRID Galerie -->
    <section class="container py-4">
      <div class="gallery masonry" id="gallery">
        <a class="g-item" data-full="/galerie1.jpg" data-caption="">
          <img src="galerie1.jpg" alt="Sala mare" loading="lazy">
        </a>
        <a class="g-item" data-full="/galerie2.jpg" data-caption="">
          <img src="galerie2.jpg" alt="Recepție" loading="lazy">
        </a>
        <a class="g-item" data-full="/galerie3.jpg" data-caption="">
          <img src="galerie3.jpg" alt="Clasă" loading="lazy">
        </a>
        <a class="g-item" data-full="/galerie4.jpg" data-caption="">
          <img src="galerie4.jpg" alt="Flori" loading="lazy">
        </a>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="modal fade" id="lbModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <!-- X -->
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Închide"></button>

        <div class="lb-wrap">
          <button type="button" id="lbPrev" class="lb-nav lb-prev" aria-label="Înapoi">‹</button>

          <figure class="lb-frame">
            <img id="lbImg" alt="">
            <figcaption id="lbCap"></figcaption>
          </figure>

          <button type="button" id="lbNext" class="lb-nav lb-next" aria-label="Înainte">›</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // (opțional) dacă ai <span id="year"> în footer
    document.getElementById('year')?.replaceChildren(new Date().getFullYear());

    // Elemente
    const gallery = document.getElementById('gallery');
    const modalEl = document.getElementById('lbModal');
    const modal   = new bootstrap.Modal(modalEl);

    const imgEl = document.getElementById('lbImg');
    const capEl = document.getElementById('lbCap');
    const prevB = document.getElementById('lbPrev');
    const nextB = document.getElementById('lbNext');

    const items = [...gallery.querySelectorAll('.g-item')];
    let idx = 0;

    function openAt(i){
      if (!items.length) return;
      idx = (i + items.length) % items.length;
      const a    = items[idx];
      const full = a.dataset.full || a.getAttribute('href') || a.querySelector('img')?.src;
      imgEl.src  = full;                 // NU forțăm width/height
      imgEl.alt  = a.querySelector('img')?.alt || '';
      capEl.textContent = a.dataset.caption || '';
    }

    // Click pe thumb -> deschide modal
    gallery.addEventListener('click', (e)=>{
      const a = e.target.closest('.g-item');
      if (!a) return;
      e.preventDefault();
      openAt(items.indexOf(a));
      modal.show();
    });

    // Prev / Next
    prevB.addEventListener('click', ()=> openAt(idx - 1));
    nextB.addEventListener('click', ()=> openAt(idx + 1));

    // Navigare cu tastele doar cât e deschis modalul
    modalEl.addEventListener('shown.bs.modal', ()=>{
      const onKey = (ev)=>{
        if (ev.key === 'ArrowLeft')  openAt(idx - 1);
        if (ev.key === 'ArrowRight') openAt(idx + 1);
      };
      window.addEventListener('keydown', onKey);
      modalEl.addEventListener('hidden.bs.modal', ()=> window.removeEventListener('keydown', onKey), { once:true });
    });
  </script>
</body>
</html>
