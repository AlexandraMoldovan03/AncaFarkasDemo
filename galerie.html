<style>
/* ═══════════════════════════════════
   VARIABILE
═══════════════════════════════════ */
:root {
  --g-green:      #1A3C2E;
  --g-green-deep: #0B1A10;
  --g-green-mid:  #162E1F;
  --g-gold:       #C9A84C;
  --g-gold-light: #EDD998;
  --g-cream:      #FAF7F2;
  --g-white:      rgba(255,255,255,.92);
  --g-muted:      rgba(255,255,255,.45);
  --g-radius:     14px;
  --g-radius-lg:  22px;
}

/* ═══════════════════════════════════
   BAZA
═══════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--g-green-deep);
  color: var(--g-white);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ═══════════════════════════════════
   NAVBAR
═══════════════════════════════════ */
/* ── NAVBAR — identic cu src/style.css (Home) ── */
.navbar {
  background: rgba(16,42,28,.96) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(201,168,76,.12);
  transition: box-shadow .3s ease, padding .3s ease, background .3s ease;
  padding-block: .7rem;
}
.navbar.scrolled {
  background: rgba(13,34,22,.98) !important;
  box-shadow: 0 4px 28px rgba(0,0,0,.22);
  padding-block: .5rem;
}
.navbar .navbar-brand {
  color: #fff !important;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: clamp(13px, 1.8vw, 16px);
  display: flex;
  align-items: center;
  gap: .65rem;
  letter-spacing: .2px;
}
.navbar .navbar-brand img {
  height: 36px; width: 36px;
  border-radius: 10px;
  border: 1.5px solid rgba(201,168,76,.35);
  object-fit: cover;
  transition: border-color .2s;
}
.navbar .navbar-brand:hover img { border-color: #C9A84C; }
.navbar .navbar-brand b { color: #C9A84C; font-weight: 700; }
.navbar .nav-link {
  color: rgba(255,255,255,.88) !important;
  font-weight: 500;
  font-size: 14px;
  padding: .45rem .85rem !important;
  border-radius: 8px;
  transition: background .2s ease, color .2s ease;
  position: relative;
  letter-spacing: .1px;
}
.navbar .nav-link::after {
  content: "";
  position: absolute;
  left: 50%; right: 50%; bottom: 5px;
  height: 1.5px;
  border-radius: 99px;
  background: #C9A84C;
  transition: left .22s ease, right .22s ease;
}
.navbar .nav-link:hover, .navbar .nav-link.active {
  color: #fff !important;
  background: rgba(255,255,255,.07);
}
.navbar .nav-link:hover::after, .navbar .nav-link.active::after { left: 14px; right: 14px; }

/* Hamburger */
.h-nav-toggler {
  border: 0 !important;
  background: rgba(255,255,255,.07) !important;
  border-radius: 10px !important;
  padding: 8px 10px !important;
  outline: none !important;
  transition: background .2s ease;
}
.h-nav-toggler:focus { box-shadow: none !important; }
.h-nav-toggler:hover { background: rgba(255,255,255,.14) !important; }
.h-burger {
  display: flex; flex-direction: column;
  justify-content: center; gap: 5px;
  width: 22px; height: 18px;
}
.h-burger span {
  display: block; height: 2px; width: 100%;
  background: #fff; border-radius: 99px;
  transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .25s ease, width .3s ease;
  transform-origin: center;
}
.h-nav-toggler[aria-expanded="true"] .h-burger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.h-nav-toggler[aria-expanded="true"] .h-burger span:nth-child(2) { opacity: 0; width: 0; }
.h-nav-toggler[aria-expanded="true"] .h-burger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* CTA */
.h-nav-cta-wrap { margin-left: .5rem; }
.h-nav-cta {
  display: inline-flex; align-items: center; gap: 7px;
  padding: .48rem 1.1rem;
  background: linear-gradient(135deg, #C9A84C 0%, #a8782e 100%);
  color: #fff !important;
  border-radius: 8px;
  font-weight: 600; font-size: 14px;
  letter-spacing: .2px;
  transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  white-space: nowrap; text-decoration: none;
}
.h-nav-cta i { font-size: 17px; line-height: 1; }
.h-nav-cta:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 18px rgba(201,168,76,.45);
  filter: brightness(1.08);
  color: #fff !important;
}

/* Mobil */
@media (max-width: 991.98px) {
  .navbar .collapse.show, .navbar .collapsing {
    background: rgba(11,30,19,.98);
    border-radius: 16px; margin-top: .6rem;
    padding: .8rem .6rem 1rem;
    box-shadow: 0 16px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(201,168,76,.12);
    backdrop-filter: blur(10px);
  }
  .navbar .nav-link { padding: .7rem 1rem !important; border-radius: 10px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .navbar .nav-link::after { display: none; }
  .navbar .nav-item:last-child .nav-link { border-bottom: none; }
  .h-nav-cta-wrap { margin-left: 0; margin-top: .6rem; padding: 0 .4rem; }
  .h-nav-cta { width: 100%; justify-content: center; padding: .75rem 1rem; border-radius: 12px; font-size: 15px; }
}

/* ═══════════════════════════════════
   HERO
═══════════════════════════════════ */
.g-hero {
  padding: 110px 0 56px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.g-hero::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 0%, rgba(26,60,46,.5) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(201,168,76,.06) 0%, transparent 60%);
  pointer-events: none;
}
.g-hero-inner { position: relative; z-index: 1; max-width: 640px; margin-inline: auto; padding: 0 20px; }
.g-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--g-gold); margin-bottom: 16px;
}
.g-label::before, .g-label::after {
  content: ""; display: block; width: 28px; height: 1.5px;
  background: var(--g-gold); border-radius: 99px;
}
.g-hero h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(32px,5vw,52px);
  font-weight: 700; color: #fff; margin: 0 0 12px; line-height: 1.1;
}
.g-hero h1 em { font-style: italic; color: var(--g-gold); }
.g-hero p { font-size: 16px; color: var(--g-muted); margin: 0; line-height: 1.65; }

/* ═══════════════════════════════════
   MASONRY GALLERY
═══════════════════════════════════ */
.g-main {
  padding: 0 clamp(12px,3vw,40px) 80px;
  max-width: 1400px;
  margin-inline: auto;
}

.g-count {
  text-align: center;
  font-size: 13px;
  color: var(--g-muted);
  margin-bottom: 28px;
  letter-spacing: .5px;
}
.g-count strong { color: var(--g-gold); }

.g-masonry {
  columns: 4;
  column-gap: 12px;
}
@media (max-width: 1100px) { .g-masonry { columns: 3; } }
@media (max-width: 680px)  { .g-masonry { columns: 2; column-gap: 8px; } }
@media (max-width: 380px)  { .g-masonry { columns: 2; column-gap: 6px; } }

/* Card foto */
.g-item {
  display: block;
  break-inside: avoid;
  margin-bottom: 12px;
  border-radius: var(--g-radius);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--g-green-mid);
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
  transition: transform .22s cubic-bezier(.2,.6,.2,1),
              box-shadow .22s ease;
}
@media (max-width: 680px) { .g-item { margin-bottom: 8px; border-radius: 10px; } }

.g-item img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  transition: transform .4s cubic-bezier(.2,.6,.2,1), filter .3s ease;
}

/* Overlay la hover */
.g-item::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 40%,
    rgba(11,26,16,.55) 100%
  );
  opacity: 0;
  transition: opacity .3s ease;
  border-radius: inherit;
}
.g-item:hover::after { opacity: 1; }

/* Icon zoom */
.g-item-zoom {
  position: absolute;
  bottom: 12px; right: 12px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(201,168,76,.9);
  display: grid; place-items: center;
  font-size: 14px; color: #fff;
  opacity: 0;
  transform: scale(.8) translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
  z-index: 2;
}
.g-item:hover .g-item-zoom { opacity: 1; transform: scale(1) translateY(0); }

.g-item:hover {
  transform: translateY(-4px) scale(1.015);
  box-shadow: 0 12px 36px rgba(0,0,0,.45), 0 0 0 2px rgba(201,168,76,.3);
}
.g-item:hover img { transform: scale(1.04); }

@media (prefers-reduced-motion: reduce) {
  .g-item, .g-item img, .g-item-zoom, .g-item::after { transition: none !important; }
  .g-item:hover { transform: none; }
  .g-item:hover img { transform: none; }
}

/* ═══════════════════════════════════
   LIGHTBOX
═══════════════════════════════════ */
.g-lb {
  position: fixed; inset: 0;
  z-index: 9000;
  display: flex; align-items: center; justify-content: center;
  background: rgba(8,18,12,.96);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s ease;
}
.g-lb.open {
  opacity: 1;
  pointer-events: auto;
}

/* Imagine */
.g-lb-frame {
  position: relative;
  max-width: min(90vw, 1100px);
  max-height: calc(100dvh - 130px);
  display: flex; align-items: center; justify-content: center;
}
.g-lb-frame img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100dvh - 130px);
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 20px 80px rgba(0,0,0,.7);
  transition: opacity .2s ease;
}
.g-lb-frame img.fading { opacity: 0; }

/* Buton închide */
.g-lb-close {
  position: fixed; top: 18px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff; font-size: 22px;
  display: grid; place-items: center;
  cursor: pointer;
  transition: background .2s, transform .2s;
  z-index: 9010;
  line-height: 1;
}
.g-lb-close:hover { background: rgba(255,255,255,.2); transform: scale(1.1); }

/* Săgeți navigare */
.g-lb-nav {
  position: fixed;
  top: 50%; transform: translateY(-50%);
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  border: 1.5px solid rgba(255,255,255,.2);
  color: #fff; font-size: 20px;
  display: grid; place-items: center;
  cursor: pointer;
  transition: background .2s, transform .2s, border-color .2s;
  z-index: 9010;
}
.g-lb-nav:hover {
  background: rgba(201,168,76,.85);
  border-color: transparent;
  transform: translateY(-50%) scale(1.08);
}
.g-lb-prev { left: 16px; }
.g-lb-next { right: 16px; }

@media (max-width: 600px) {
  .g-lb-prev { left: 8px; }
  .g-lb-next { right: 8px; }
  .g-lb-nav  { width: 42px; height: 42px; font-size: 17px; }
}

/* Counter */
.g-lb-counter {
  position: fixed;
  bottom: 22px; left: 50%;
  transform: translateX(-50%);
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,.55);
  letter-spacing: 1px;
  background: rgba(0,0,0,.3);
  padding: 5px 14px;
  border-radius: 99px;
  z-index: 9010;
  backdrop-filter: blur(6px);
  white-space: nowrap;
}
.g-lb-title {
  position: fixed;
  bottom: 56px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.65);
  color: rgba(255,255,255,.9);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 13px;
  max-width: 80vw;
  text-align: center;
  z-index: 9010;
  pointer-events: none;
  backdrop-filter: blur(6px);
}
/* Loading state galerie */
.g-loading {
  grid-column: 1/-1; text-align: center; padding: 3rem;
  color: var(--g-muted); font-size: 1rem;
}

/* Scroll progress */
#scrollProgress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--g-gold), #e8b84b);
  z-index: 1200; transition: width .1s linear;
}
</style>
</head>

<!-- ═══ HERO ═══ -->
<section class="g-hero">

<!-- ═══ LIGHTBOX ═══ -->
<div class="g-lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Vizualizare fotografie">

    <i class="fa-solid fa-chevron-right"></i>
  </button>
  <div class="g-lb-counter" id="lbCounter">…</div>
  <div class="g-lb-title" id="lbTitle" style="display:none"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabase = createClient(
  'https://gxavdytkcukxnvonasur.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YXZkeXRrY3VreG52b25hc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzUzOTgsImV4cCI6MjA2OTQ1MTM5OH0.n2vXj6iziz3896EpzhjOotTuveqd7GjIhgAuExCOLW8'
)

/* ═══════════════════════════════════
   STARE GLOBALĂ
═══════════════════════════════════ */
let PHOTOS  = []   // [{ url, title }]
let current = 0
let isOpen  = false

/* ═══════════════════════════════════
   DOM
═══════════════════════════════════ */
const gallery  = document.getElementById('gallery')
const lb       = document.getElementById('lightbox')
const lbImg    = document.getElementById('lbImg')
const lbCount  = document.getElementById('lbCounter')
const lbTitle  = document.getElementById('lbTitle')
const lbClose  = document.getElementById('lbClose')
const lbPrev   = document.getElementById('lbPrev')
const lbNext   = document.getElementById('lbNext')

/* ═══════════════════════════════════
   ÎNCARCĂ POZE DIN SUPABASE
═══════════════════════════════════ */
gallery.innerHTML = '<p class="g-loading">Se încarcă galeria…</p>'

const { data, error } = await supabase
  .from('gallery_images')
  .select('image_url, title')
  .order('created_at', { ascending: false })

if (error || !data?.length) {
  gallery.innerHTML = '<p class="g-loading">Galeria nu are fotografii momentan.</p>'
  if (error) console.warn('gallery_images:', error.message)
} else {
  PHOTOS = data.map(r => ({ url: r.image_url, title: r.title || '' }))

  const cntEl = document.getElementById('photoCount')
  if (cntEl) cntEl.textContent = PHOTOS.length
  lbCount.textContent = `1 / ${PHOTOS.length}`

  gallery.innerHTML = ''
  PHOTOS.forEach((photo, i) => {
    const a = document.createElement('a')
    a.className = 'g-item'
    a.href = '#'
    a.dataset.index = i
    a.setAttribute('aria-label', `Deschide fotografia ${i + 1}`)

    const img = document.createElement('img')
    img.src = photo.url
    img.alt = photo.title || `Fotografie ${i + 1} — Education with Style®`
    img.loading = i < 6 ? 'eager' : 'lazy'
    img.decoding = 'async'

    const zoom = document.createElement('span')
    zoom.className = 'g-item-zoom'
    zoom.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i>'
    zoom.setAttribute('aria-hidden', 'true')

    a.appendChild(img)
    a.appendChild(zoom)
    gallery.appendChild(a)
  })
}

/* ═══════════════════════════════════
   LIGHTBOX
═══════════════════════════════════ */
function openAt(i) {
  if (!PHOTOS.length) return
  current = ((i % PHOTOS.length) + PHOTOS.length) % PHOTOS.length
  lbImg.classList.add('fading')
  setTimeout(() => {
    lbImg.src = PHOTOS[current].url
    lbImg.alt = PHOTOS[current].title || `Fotografie ${current + 1}`
    lbCount.textContent = `${current + 1} / ${PHOTOS.length}`
    if (lbTitle) {
      lbTitle.textContent = PHOTOS[current].title
      lbTitle.style.display = PHOTOS[current].title ? '' : 'none'
    }
    lbImg.classList.remove('fading')
  }, 180)
}

function openLB(i) {
  isOpen = true
  lb.classList.add('open')
  lb.removeAttribute('aria-hidden')
  document.body.style.overflow = 'hidden'
  openAt(i)
  lbClose.focus()
}

function closeLB() {
  isOpen = false
  lb.classList.remove('open')
  lb.setAttribute('aria-hidden', 'true')
  document.body.style.overflow = ''
}

/* Click pe thumbnail */
gallery.addEventListener('click', e => {
  const item = e.target.closest('.g-item')
  if (!item) return
  e.preventDefault()
  openLB(+item.dataset.index)
})

/* Butoane lightbox */
lbClose.addEventListener('click', closeLB)
lbPrev.addEventListener('click',  () => openAt(current - 1))
lbNext.addEventListener('click',  () => openAt(current + 1))

/* Click pe fundal închide */
lb.addEventListener('click', e => { if (e.target === lb) closeLB() })

/* Tastatură */
document.addEventListener('keydown', e => {
  if (!isOpen) return
  if (e.key === 'ArrowLeft')  openAt(current - 1)
  if (e.key === 'ArrowRight') openAt(current + 1)
  if (e.key === 'Escape')     closeLB()
})

/* Touch / swipe */
let touchStartX = 0
lb.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX }, { passive: true })
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX
  if (Math.abs(dx) > 50) dx < 0 ? openAt(current + 1) : openAt(current - 1)
}, { passive: true })

/* ═══════════════════════════════════
   SCROLL EFFECTS
═══════════════════════════════════ */
const navbar   = document.querySelector('.navbar')
const progress = document.getElementById('scrollProgress')
const total    = () => document.documentElement.scrollHeight - window.innerHeight

window.addEventListener('scroll', () => {
  if (window.scrollY > 10) navbar.classList.add('scrolled')
  else navbar.classList.remove('scrolled')
  if (progress) progress.style.width = (window.scrollY / (total() || 1) * 100) + '%'
}, { passive: true })
</script>

<script type="module" src="/navbar-auth.js"></script>
</body>
</html>
