<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Shop — Categoria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/shop.css" />
  <style>
    .with-navbar{padding-top:84px}
    .cover{
      border-radius:22px; overflow:hidden; position:relative; min-height:220px;
      background:radial-gradient(1200px 600px at 10% -10%, #20303a 0, #0b0f0c 55%);
      color:#fff; box-shadow:0 30px 80px rgba(0,0,0,.45)
    }
    .cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.18}
    .cover .inner{position:relative; z-index:1; padding:28px}
    .subchips{
      position:sticky; top:84px; z-index:5; backdrop-filter:saturate(1.2) blur(6px);
      background:rgba(11,15,12,.55); padding:10px 12px; border-radius:14px; margin:12px 0 18px
    }
    .chip{border:none; border-radius:999px; padding:8px 12px; font-weight:600}
    .chip.active{background:#e2b964; color:#000}
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/index.html">
        <img src="/logo1.jpg" alt="Logo" style="height:40px;width:auto;margin-right:10px;">
        <span>Prof&Coach FARKAS-RUSU <b>ANCA</b></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="/auth.html" id="nav-auth">Login / Register</a></li>
          <li class="nav-item d-none"><a class="nav-link" href="/dashboard.html" id="nav-dash">Dashboard</a></li>
          <li class="nav-item d-none"><button class="btn btn-sm btn-outline-light ms-lg-2" id="btnLogout">Logout</button></li>
          <li class="nav-item d-none"><span class="nav-link disabled" id="navEmail" style="opacity:.8;"></span></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container with-navbar">
    <!-- HEADER CATEGORIE -->
    <section class="cover">
      <img src="banner.jpg" alt="">
      <div class="inner">
        <h1 id="catTitle" class="h3 mb-1">Cursuri</h1>
        <p id="catDesc" class="mb-0"></p>
      </div>
    </section>

    <!-- SUBCAPITOLE – apar doar la school -->
    <section id="subnav" class="subchips d-flex flex-wrap gap-2" hidden>
      <button class="chip btn btn-outline-light" data-sub="">Toate</button>
      <button class="chip btn btn-outline-light" data-sub="prep">Clasa pregătitoare</button>
      <button class="chip btn btn-outline-light" data-sub="1">Clasa I</button>
      <button class="chip btn btn-outline-light" data-sub="2">Clasa a II-a</button>
      <button class="chip btn btn-outline-light" data-sub="3">Clasa a III-a</button>
      <button class="chip btn btn-outline-light" data-sub="4">Clasa a IV-a</button>
      <button class="chip btn btn-outline-light" data-sub="parents">Sfaturi pentru părinți</button>
    </section>

    <!-- BARĂ AUTENTIFICARE / INVITAT -->
    <section class="shop-authbar">
      <div id="authStatus">Verificare autentificare…</div>
      <div id="guestBox" class="guest-box" hidden>
        <label for="guestEmail" class="d-flex align-items-center gap-2 m-0">
          <span>Email pentru livrarea PDF (invitat):</span>
          <input id="guestEmail" type="email" placeholder="nume@exemplu.com" />
        </label>
      </div>
    </section>

    <!-- GRID PRODUSE -->
    <section id="products" class="grid"></section>
  </main>

  <footer class="shop-footer">
    <small>&copy; <span id="year"></span> — Toate drepturile rezervate.</small>
  </footer>

 <script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    'https://gxavdytkcukxnvonasur.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YXZkeXRrY3VreG52b25hc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzUzOTgsImV4cCI6MjA2OTQ1MTM5OH0.n2vXj6iziz3896EpzhjOotTuveqd7GjIhgAuExCOLW8'
  )
  const API_BASE = 'https://stripe-backend-q89t.onrender.com'
  const money = c => (c/100).toFixed(2) + ' RON'
  document.getElementById('year').textContent = new Date().getFullYear()

  // --- CATEGORIE din URL (MUTAT + DEBLOCAT) ---
  const qs  = new URLSearchParams(location.search)
  const CAT = (qs.get('cat') === 'school') ? 'school' : 'exp'   // default 'exp'
  let currentSub = (qs.get('sub') || '').trim().toLowerCase();

  // arată subcapitolele doar pentru categoria "school"
  const subnav = document.getElementById('subnav')
  if (CAT === 'school') {
    subnav.hidden = false
  } else {
    subnav.remove() // la „Experiențe” nu arătăm bara
  }

  // header text corect pentru categoria curentă
  const copy = {
    exp: {
      title: 'Experiențele mele, lecțiile tale – Când viața întâlnește Stilul',
      desc:  'Ghiduri și reflecții pentru inspirație personală. Acest material este destinat exclusiv cumpărătorului.'
    },
    school: {
      title: 'Școala cu Stil Online — by Prof & Coach Anca',
      desc:  'Fișe educative, mini-ghiduri interactive și videouri pentru ciclul primar + sfaturi pentru părinți.'
    }
  }
  catTitle.textContent = copy[CAT].title
  catDesc.textContent  = copy[CAT].desc

  // --- NAV auth (ca la tine) ---
  const navAuth = document.getElementById('nav-auth')
  const navDash = document.getElementById('nav-dash')?.parentElement
  const btnLogoutWrap = document.getElementById('btnLogout')?.parentElement
  const navEmailWrap  = document.getElementById('navEmail')?.parentElement
  const setNav = (email)=>{
    const logged = !!email
    navAuth?.classList.toggle('d-none', logged)
    navDash?.classList.toggle('d-none', !logged)
    btnLogoutWrap?.classList.toggle('d-none', !logged)
    navEmailWrap?.classList.toggle('d-none', !logged)
    if (logged) document.getElementById('navEmail').textContent = email
  }
  const { data:{ user } } = await supabase.auth.getUser()
  setNav(user?.email || null)
  supabase.auth.onAuthStateChange((_e,s)=>setNav(s?.user?.email||null))
  document.getElementById('btnLogout')?.addEventListener('click', async()=>{
    await supabase.auth.signOut(); location.href='/auth.html'
  })

  // --- Auth bar ---
  const authStatus = document.getElementById('authStatus')
  const guestBox   = document.getElementById('guestBox')
  const guestEmail = document.getElementById('guestEmail')
  if (user?.email){ authStatus.textContent = `Ești logat(ă) ca: ${user.email}`; guestBox.hidden = true }
  else { authStatus.textContent = 'Cumperi ca invitat(ă) sau autentifică-te din meniu.'; guestBox.hidden = false }

  // --- LISTARE produse, doar după category ---
  const wrap = document.getElementById('products')
  let prodsAll = []                     // toate produsele din categoria curentă

  const norm = v => String(v ?? '').trim().toLowerCase()

  function setActiveChip(sub){
    if (!subnav || subnav.hidden) return
    subnav.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', norm(c.dataset.sub) === norm(sub))
    })
  }

  function render(){
    const list = currentSub
      ? prodsAll.filter(p => norm(p.subcategory) === currentSub)
      : prodsAll

    if (!list.length) {
      wrap.innerHTML = '<p>Nu sunt materiale pentru subcategoria aleasă.</p>'
      return
    }

    wrap.innerHTML = list.map(p => `
      <article class="card">
        ${p.image_url ? `<img class="card-img" src="${p.image_url}" alt="${p.name}" loading="lazy">` : ''}
        <h3>${p.name}</h3>
        ${p.description ? `<p class="desc" id="d-${p.id}">${p.description}</p><button class="more" data-target="d-${p.id}" aria-expanded="false">Mai mult</button>` : ''}
        <div class="price">${money(p.amount_cents)}</div>
        <button class="button buy" data-id="${p.id}">Cumpără</button>
      </article>
    `).join('')

    // aspect ratio real & contain
    document.querySelectorAll('#products .card-img').forEach(img=>{
      const fit=()=>{ if(img.naturalWidth&&img.naturalHeight){ img.style.aspectRatio=`${img.naturalWidth}/${img.naturalHeight}`; img.style.objectFit='contain' } }
      img.complete ? fit() : img.addEventListener('load',fit,{once:true})
    })

    // arată „Mai mult” doar dacă e necesar
    requestAnimationFrame(()=>{
      document.querySelectorAll('#products .desc').forEach(d=>{
        const b = d.nextElementSibling?.classList.contains('more') ? d.nextElementSibling : null
        if (!b) return
        if (d.scrollHeight <= d.clientHeight + 1) b.remove()
      })
    })
  }

  async function load(){
    wrap.innerHTML = '<p>Se încarcă…</p>'

    // !!! includem și subcategory aici
    const { data: prods, error } = await supabase
      .from('products')
      .select('id, name, amount_cents, description, image_url, category, subcategory')
      .eq('active', true)
      .eq('category', CAT)
      .order('id')

    if (error){ wrap.innerHTML = `<p>Eroare: ${error.message}</p>`; return }

    prodsAll = (prods ?? []).map(p => ({ ...p, subcategory: norm(p.subcategory) }))
    // dacă sub din URL nu există, revenim pe „Toate”
    if (CAT === 'school'){
      const subs = new Set(prodsAll.map(p=>p.subcategory))
      if (currentSub && !subs.has(currentSub)) currentSub = ''
      setActiveChip(currentSub)
    }
    render()
  }
  await load()

  // click pe chip-uri (filtru)
  subnav?.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip'); if(!chip) return
    currentSub = norm(chip.dataset.sub || '')
    setActiveChip(currentSub)
    // păstrăm filtrul în URL (fără reload)
    const url = new URL(location.href)
    currentSub ? url.searchParams.set('sub', currentSub) : url.searchParams.delete('sub')
    history.replaceState({}, '', url)
    render()
  })

  // toggles descriere + checkout (event delegation)
  wrap.addEventListener('click', async e=>{
    const more = e.target.closest('.more')
    if (more){
      const id = more.dataset.target
      const p  = document.getElementById(id)
      const ex = p.classList.toggle('expanded')
      more.textContent = ex ? 'Mai puțin' : 'Mai mult'
      more.setAttribute('aria-expanded', String(ex))
      return
    }

    const btn = e.target.closest('.buy'); if (!btn) return
    const itemId = btn.dataset.id
    let email = user?.email ?? (guestEmail.value || '').trim()
    if (!email){ alert('Introdu un email pentru livrarea PDF-ului.'); return }

    try{
      btn.disabled = true; btn.textContent = 'Se deschide...'
      const resp = await fetch(`${API_BASE}/create-checkout-session`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ itemId, userEmail: email })
      })
      const js = await resp.json().catch(()=>({}))
      if (!resp.ok || !js?.url){ console.error(js); alert(js?.error || 'Eroare la checkout'); return }
      location.href = js.url
    }catch(err){ console.error(err); alert('Eroare rețea.') }
    finally{ btn.disabled=false; btn.textContent='Cumpără' }
  })
</script>
</body>
</html>
